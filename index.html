<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BGS ScoreHub — Live Sports & Scores</title>
  
  <!-- PWA Manifest & Mobile Theme Settings -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d061a">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pitch.css">
</head>
<body class="bg-[#0d061a] text-slate-100 font-sans antialiased min-h-screen pb-24 select-none">

  <!-- TOP HEADER BAR -->
  <header class="sticky top-0 z-40 bg-[#0d061a]/95 backdrop-blur-xl border-b border-white/10 px-4 py-3 shadow-md transition-all duration-200">
    <div class="w-full max-w-[1400px] mx-auto flex items-center justify-between gap-3">
      
      <!-- Logo & Brand Info -->
      <div class="flex items-center gap-3 cursor-pointer" onclick="bottomNavSwitch('live')">
        <div class="w-10 h-10 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center shrink-0 shadow-sm p-1.5 group hover:scale-105 transition-transform">
          <svg class="w-full h-full" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 5 L90 20 L90 60 C90 80 50 95 50 95 C50 95 10 80 10 60 L10 20 Z" fill="#059669" stroke="#10b981" stroke-width="6"/>
            <text x="50" y="58" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">BGS</text>
          </svg>
        </div>
        <div>
          <h1 class="text-base font-extrabold tracking-tight text-white leading-none flex items-center gap-1.5">
            BGS <span class="text-emerald-400 font-black">ScoreHub</span>
          </h1>
          <span id="user-timezone-info" class="text-[10px] text-emerald-400 font-bold block mt-0.5">Zona HP: WIB</span>
        </div>
      </div>

      <!-- Action Tools / Top Buttons -->
      <div class="flex items-center gap-2">
        <button id="data-saver-btn" onclick="toggleDataSaver()" class="px-3 py-1.5 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl text-slate-300 transition flex items-center gap-1.5 text-xs font-semibold shadow-sm active:scale-95">
          <i class="fa-solid fa-bolt text-amber-400 text-xs"></i>
          <span id="data-saver-label" class="text-[11px]">Normal</span>
        </button>

        <button onclick="openSettingsModal()" class="w-9 h-9 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl text-slate-300 transition flex items-center justify-center text-xs shadow-sm active:scale-95" title="Pengaturan Notifikasi">
          <i class="fa-solid fa-bell"></i>
        </button>

        <button onclick="loadData(false)" class="w-9 h-9 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white rounded-xl transition flex items-center justify-center text-xs shadow-md shadow-emerald-600/20">
          <i id="refresh-icon" class="fa-solid fa-rotate-right"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="w-full max-w-[1400px] mx-auto px-3 sm:px-6 pt-3 space-y-3">

    <!-- SEARCH & FILTER TOOLBAR -->
    <div class="space-y-2.5 bg-[#180d30] p-3 rounded-2xl border border-white/10 shadow-sm">
      
      <!-- Search Input Box -->
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
        <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="Cari tim, pertandingan, atau liga..." class="w-full bg-[#0f0720] border border-white/10 rounded-xl pl-9 pr-9 py-2.5 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-emerald-500/80 transition-all shadow-inner">
        <button id="search-clear-btn" onclick="clearSearch()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-xs hidden p-1">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Header Controls & League Selector -->
      <div id="top-all-matches-header" class="flex items-center justify-between gap-2">
        <button onclick="openLeagueModal()" class="flex-1 bg-[#0f0720] border border-white/10 hover:border-white/20 p-2.5 rounded-xl flex items-center justify-between text-xs text-slate-200 transition shadow-sm group">
          <span id="active-league-badge" class="font-bold truncate flex items-center gap-2 text-emerald-400">
            <i class="fa-solid fa-globe"></i> Semua Liga
          </span>
          <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 group-hover:text-white transition-transform"></i>
        </button>
      </div>

      <!-- Mode Info Badge -->
      <div id="active-badge-container" class="flex items-center justify-between px-1 text-[10px] text-slate-400 font-medium">
        <span id="active-mode-tag">Urut Waktu & Tim Favorit</span>
      </div>

      <!-- Horizontal Date Navigation Strip Container -->
      <div id="date-strip-container" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5"></div>
    </div>

    <!-- LOADING SPINNER -->
    <div id="loading" class="hidden py-16 text-center space-y-3">
      <div class="inline-flex p-3 rounded-2xl bg-emerald-950/60 border border-emerald-500/30 shadow-sm">
        <i class="fa-solid fa-circle-notch fa-spin text-2xl text-emerald-400"></i>
      </div>
      <p class="text-xs text-slate-400 font-bold">Memuat data live skor...</p>
    </div>

    <!-- CONTENT VIEWS -->
    <div id="matches-container" class="space-y-2.5"></div>
    <div id="live-container" class="space-y-4 hidden"></div>
    <div id="fav-container" class="space-y-4 hidden"></div>
    <div id="standings-container" class="space-y-3 hidden"></div>
    <div id="news-container" class="space-y-3 hidden"></div>
    <div id="search-results-container" class="space-y-3 hidden"></div>

  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-3 left-3 right-3 sm:left-1/2 sm:-translate-x-1/2 sm:w-[520px] z-40 bg-[#0d061a]/95 backdrop-blur-xl border border-white/10 rounded-2xl p-1.5 shadow-xl">
    <div class="grid grid-cols-5 gap-1 text-center">
      
      <button id="bnav-all" onclick="bottomNavSwitch('all')" class="bnav-item py-2 px-1 rounded-xl flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition-all duration-150">
        <i class="fa-solid fa-house text-base mb-1"></i>
        <span class="text-[10px]">Semua</span>
      </button>

      <button id="bnav-live" onclick="bottomNavSwitch('live')" class="bnav-item py-2 px-1 rounded-xl flex flex-col items-center justify-center text-emerald-400 font-bold transition-all duration-150">
        <i class="fa-solid fa-tower-broadcast text-base mb-1"></i>
        <span class="text-[10px]">Live</span>
      </button>

      <button id="bnav-fav" onclick="bottomNavSwitch('fav')" class="bnav-item py-2 px-1 rounded-xl flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition-all duration-150">
        <i class="fa-solid fa-star text-base mb-1"></i>
        <span class="text-[10px]">Favorit</span>
      </button>

      <button id="bnav-league" onclick="bottomNavSwitch('league')" class="bnav-item py-2 px-1 rounded-xl flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition-all duration-150">
        <i class="fa-solid fa-trophy text-base mb-1"></i>
        <span class="text-[10px]">Klasemen</span>
      </button>

      <button id="bnav-news" onclick="bottomNavSwitch('news')" class="bnav-item py-2 px-1 rounded-xl flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition-all duration-150">
        <i class="fa-solid fa-newspaper text-base mb-1"></i>
        <span class="text-[10px]">Berita</span>
      </button>

    </div>
  </nav>

  <!-- MODAL: LEAGUE SELECTOR -->
  <div id="league-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4 hidden transition-opacity">
    <div class="bg-[#0d061a] border border-white/10 w-full max-w-md md:max-w-xl rounded-t-3xl sm:rounded-3xl max-h-[85vh] flex flex-col overflow-hidden shadow-2xl">
      <div class="p-4 border-b border-white/10 flex items-center justify-between shrink-0 bg-[#180d30]">
        <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-400 flex items-center gap-2">
          <i class="fa-solid fa-trophy"></i> Pilih Liga
        </h3>
        <button onclick="closeLeagueModal()" class="w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 text-slate-300 flex items-center justify-center text-xs transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div id="league-selector-grid" class="p-3 overflow-y-auto space-y-2"></div>
    </div>
  </div>

  <!-- MODAL: MATCH DETAIL -->
  <div id="detail-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex flex-col justify-center sm:items-center p-0 sm:p-4 hidden transition-all duration-300">
    <div class="bg-[#0d061a] border-0 sm:border border-white/10 w-full max-w-md md:max-w-2xl lg:max-w-3xl h-full sm:h-auto sm:max-h-[92vh] rounded-none sm:rounded-3xl flex flex-col overflow-hidden shadow-2xl">
      
      <!-- Modal Header Bar -->
      <div class="p-3.5 border-b border-white/10 flex items-center justify-between bg-[#180d30] shrink-0">
        <button onclick="closeModal()" class="text-emerald-400 hover:text-emerald-300 font-extrabold text-xs flex items-center gap-1.5 transition px-3 py-1.5 rounded-xl bg-emerald-950/60 border border-emerald-500/30 active:scale-95">
          <i class="fa-solid fa-arrow-left"></i> Kembali
        </button>
        <span id="modal-league-name" class="text-xs font-black text-white truncate flex items-center justify-center gap-1.5 max-w-[60%] tracking-tight">Detail Pertandingan</span>
        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 text-slate-300 flex items-center justify-center text-xs transition active:scale-95">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Loading State -->
      <div id="modal-loading" class="py-20 text-center space-y-3 flex-1 flex flex-col items-center justify-center bg-[#0d061a]">
        <div class="p-4 rounded-2xl bg-emerald-950/60 border border-emerald-500/30 shadow-sm">
          <i class="fa-solid fa-circle-notch fa-spin text-2xl text-emerald-400"></i>
        </div>
        <p class="text-xs text-slate-400 font-bold tracking-wide">Memuat rincian pertandingan...</p>
      </div>

      <!-- Modal Body Content -->
      <div id="modal-data-container" class="flex-1 overflow-y-auto p-3.5 space-y-4 hidden no-scrollbar">
        <div id="modal-score-header"></div>

        <!-- Detail Navigation Segmented Pill Tabs (ODDS DI SEBELAH KANAN LINEUP) -->
        <div id="modal-tabs-bar" class="flex bg-[#180d30] p-1.5 rounded-2xl border border-white/10 overflow-x-auto no-scrollbar gap-1 shadow-inner">
          <button id="mtab-summary" onclick="switchModalTab('summary')" class="flex-1 py-2 px-3 text-[11px] font-extrabold tab-pill-active rounded-xl transition-all duration-200 whitespace-nowrap">Ringkasan</button>
          <button id="mtab-stats" onclick="switchModalTab('stats')" class="flex-1 py-2 px-3 text-[11px] font-semibold tab-pill-inactive rounded-xl transition-all duration-200 whitespace-nowrap">Statistik</button>
          <button id="mtab-lineup" onclick="switchModalTab('lineup')" class="flex-1 py-2 px-3 text-[11px] font-semibold tab-pill-inactive rounded-xl transition-all duration-200 whitespace-nowrap">Lineup</button>
          <button id="mtab-odds" onclick="switchModalTab('odds')" class="flex-1 py-2 px-3 text-[11px] font-semibold tab-pill-inactive rounded-xl transition-all duration-200 whitespace-nowrap"><i class="fa-solid fa-coins mr-1"></i>Odds</button>
          <button id="mtab-standings" onclick="switchModalTab('standings')" class="flex-1 py-2 px-3 text-[11px] font-semibold tab-pill-inactive rounded-xl transition-all duration-200 whitespace-nowrap">League</button>
          <button id="mtab-h2h" onclick="switchModalTab('h2h')" class="flex-1 py-2 px-3 text-[11px] font-semibold tab-pill-inactive rounded-xl transition-all duration-200 whitespace-nowrap">Form & H2H</button>
        </div>

        <div id="mcontent-summary" class="space-y-3"></div>
        <div id="mcontent-stats" class="space-y-3 hidden"></div>
        <div id="mcontent-lineup" class="space-y-3 hidden"></div>
        <div id="mcontent-odds" class="space-y-3 hidden"></div>
        <div id="mcontent-standings" class="space-y-3 hidden"></div>
        <div id="mcontent-h2h" class="space-y-3 hidden"></div>
      </div>

    </div>
  </div>

  <!-- MODAL: TEAM DETAIL -->
  <div id="team-detail-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex flex-col justify-center sm:items-center p-0 sm:p-4 hidden">
    <div class="bg-[#0d061a] border-0 sm:border border-white/10 w-full max-w-md md:max-w-2xl lg:max-w-3xl h-full sm:h-auto sm:max-h-[92vh] rounded-none sm:rounded-3xl flex flex-col overflow-hidden shadow-2xl">
      
      <div class="p-3.5 border-b border-white/10 flex items-center justify-between shrink-0 bg-[#180d30]">
        <button onclick="closeTeamModal()" class="text-emerald-400 hover:text-emerald-300 font-bold text-xs flex items-center gap-1.5 transition px-3 py-1.5 rounded-xl bg-emerald-950/60 border border-emerald-500/30">
          <i class="fa-solid fa-arrow-left"></i> Kembali
        </button>
        <span id="team-modal-title" class="text-xs font-black text-white truncate max-w-[65%]">Detail Klub</span>
        <button onclick="closeTeamModal()" class="w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 text-slate-300 flex items-center justify-center text-xs transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div id="team-modal-banner" class="p-4 bg-[#180d30] border-b border-white/10 flex items-center justify-between shrink-0"></div>

      <div class="flex bg-[#0f0720] p-1 border-b border-white/10 shrink-0">
        <button id="ttab-player" onclick="switchTeamModalTab('player')" class="flex-1 py-2 text-xs font-bold text-emerald-400 border-b-2 border-emerald-400 transition">Skuad Pemain</button>
        <button id="ttab-summary" onclick="switchTeamModalTab('summary')" class="flex-1 py-2 text-xs font-bold text-slate-400 hover:text-white transition">Pertandingan</button>
        <button id="ttab-standings" onclick="switchTeamModalTab('standings')" class="flex-1 py-2 text-xs font-bold text-slate-400 hover:text-white transition">Klasemen</button>
      </div>

      <div id="team-modal-body" class="flex-1 overflow-y-auto p-3 space-y-3">
        <div id="tcontent-player" class="space-y-3"></div>
        <div id="tcontent-summary" class="space-y-3 hidden"></div>
        <div id="tcontent-standings" class="space-y-3 hidden"></div>
      </div>

    </div>
  </div>

  <!-- MODAL: SETTINGS -->
  <div id="settings-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 hidden">
    <div class="bg-[#0d061a] border border-white/10 w-full max-w-sm md:max-w-md rounded-3xl overflow-hidden shadow-2xl space-y-3 p-4">
      
      <div class="flex items-center justify-between border-b border-white/10 pb-3">
        <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-400 flex items-center gap-2">
          <i class="fa-solid fa-bell"></i> Pengaturan Notifikasi & Suara
        </h3>
        <button onclick="closeSettingsModal()" class="w-8 h-8 rounded-full bg-white/5 text-slate-300 hover:text-white flex items-center justify-center text-xs">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="bg-[#180d30] p-3 rounded-2xl border border-white/10 flex items-center justify-between text-xs">
        <div>
          <div class="font-bold text-white">Izin Push Notification</div>
          <div id="notif-permission-status" class="text-[10px] text-slate-400 mt-0.5">Memeriksa izin...</div>
        </div>
        <button id="btn-request-notif" onclick="requestNotificationPermission()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-[10px] font-bold transition shadow-sm">Aktifkan</button>
      </div>

      <div class="space-y-2 text-xs max-h-[50vh] overflow-y-auto pr-1">
        <label class="flex items-center justify-between bg-[#180d30] p-2.5 rounded-xl border border-white/10 cursor-pointer hover:border-white/20 transition">
          <span class="font-bold text-white">Master Suara & Push Notif</span>
          <input type="checkbox" id="snd-master" onchange="updateSoundSetting('master', this.checked)" class="accent-emerald-500 w-4 h-4 rounded">
        </label>
        
        <label class="flex items-center justify-between bg-[#180d30] p-2.5 rounded-xl border border-white/10 cursor-pointer hover:border-white/20 transition">
          <span class="text-slate-300">Notifikasi Gol (Goal)</span>
          <input type="checkbox" id="snd-goal" onchange="updateSoundSetting('goal', this.checked)" class="accent-emerald-500 w-4 h-4 rounded">
        </label>

        <label class="flex items-center justify-between bg-[#180d30] p-2.5 rounded-xl border border-white/10 cursor-pointer hover:border-white/20 transition">
          <span class="text-slate-300">Notifikasi Lineup Dirilis</span>
          <input type="checkbox" id="snd-lineup" onchange="updateSoundSetting('lineup', this.checked)" class="accent-emerald-500 w-4 h-4 rounded">
        </label>

        <label class="flex items-center justify-between bg-[#180d30] p-2.5 rounded-xl border border-white/10 cursor-pointer hover:border-white/20 transition">
          <span class="text-slate-300">Pluit Kick-off Babak 1</span>
          <input type="checkbox" id="snd-kickoff1" onchange="updateSoundSetting('kickoff1', this.checked)" class="accent-emerald-500 w-4 h-4 rounded">
        </label>

        <label class="flex items-center justify-between bg-[#180d30] p-2.5 rounded-xl border border-white/10 cursor-pointer hover:border-white/20 transition">
          <span class="text-slate-300">Pluit Babak Pertama (HT)</span>
          <input type="checkbox" id="snd-halftime" onchange="updateSoundSetting('halftime', this.checked)" class="accent-emerald-500 w-4 h-4 rounded">
        </label>

        <label class="flex items-center justify-between bg-[#180d30] p-2.5 rounded-xl border border-white/10 cursor-pointer hover:border-white/20 transition">
          <span class="text-slate-300">Pluit Kick-off Babak 2</span>
          <input type="checkbox" id="snd-kickoff2" onchange="updateSoundSetting('kickoff2', this.checked)" class="accent-emerald-500 w-4 h-4 rounded">
        </label>

        <label class="flex items-center justify-between bg-[#180d30] p-2.5 rounded-xl border border-white/10 cursor-pointer hover:border-white/20 transition">
          <span class="text-slate-300">Pluit Laga Selesai (FT)</span>
          <input type="checkbox" id="snd-fulltime" onchange="updateSoundSetting('fulltime', this.checked)" class="accent-emerald-500 w-4 h-4 rounded">
        </label>

        <label class="flex items-center justify-between bg-[#180d30] p-2.5 rounded-xl border border-white/10 cursor-pointer hover:border-white/20 transition">
          <span class="text-slate-300">Suara Tendangan Sudut (Corner)</span>
          <input type="checkbox" id="snd-corner" onchange="updateSoundSetting('corner', this.checked)" class="accent-emerald-500 w-4 h-4 rounded">
        </label>

        <label class="flex items-center justify-between bg-[#180d30] p-2.5 rounded-xl border border-white/10 cursor-pointer hover:border-white/20 transition">
          <span class="text-slate-300">Suara Kartu Kuning</span>
          <input type="checkbox" id="snd-yellow" onchange="updateSoundSetting('yellow', this.checked)" class="accent-emerald-500 w-4 h-4 rounded">
        </label>

        <label class="flex items-center justify-between bg-[#180d30] p-2.5 rounded-xl border border-white/10 cursor-pointer hover:border-white/20 transition">
          <span class="text-slate-300">Suara Kartu Merah</span>
          <input type="checkbox" id="snd-red" onchange="updateSoundSetting('red', this.checked)" class="accent-emerald-500 w-4 h-4 rounded">
        </label>
      </div>

    </div>
  </div>

  <!-- SCRIPT IMPORTS -->
  <script src="js/data.js"></script>
  <script src="js/odds.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/liga2.js"></script>
  <script src="js/matches.js"></script>
  <script src="js/teams.js"></script>
  <script src="js/standings.js"></script>
  <script src="js/news.js"></script>
  <script src="js/modals.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
